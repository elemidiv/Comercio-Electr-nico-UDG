<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UDG - E-commerce</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-50 font-sans text-gray-900">

    <header class="sticky top-0 z-50 bg-white shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <h1 class="text-2xl font-bold text-indigo-600 tracking-tighter">UDG</h1>
            
            <div class="flex-1 mx-4 hidden md:block">
                <input type="text" placeholder="Buscar productos..." class="w-full bg-gray-100 border-none rounded-full px-4 py-2 focus:ring-2 focus:ring-indigo-400">
            </div>

            <div class="flex items-center space-x-5">
                <button onclick="toggleModal('login-modal')" class="text-gray-600 hover:text-indigo-600">
                    <i class="fa-regular fa-user text-xl"></i>
                </button>
                <button onclick="toggleModal('cart-modal')" class="relative text-gray-600 hover:text-indigo-600">
                    <i class="fa-solid fa-cart-shopping text-xl"></i>
                    <span id="cart-count" class="absolute -top-2 -right-2 bg-red-500 text-white text-[10px] rounded-full h-4 w-4 flex items-center justify-center">0</span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto pb-20">
        
        <section class="mt-6 px-4">
            <h2 class="text-xl font-bold mb-4">Recién llegados ✨</h2>
            <div class="flex overflow-x-auto gap-4 no-scrollbar pb-4">
                <div class="min-w-[160px] md:min-w-[220px] bg-white rounded-xl shadow-sm p-3 border border-gray-100">
                    <div class="h-32 md:h-44 bg-gray-200 rounded-lg mb-3 overflow-hidden">
                        <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&q=80&w=200" alt="Reloj" class="w-full h-full object-cover">
                    </div>
                    <h3 class="text-sm font-semibold truncate">Smart Watch V3</h3>
                    <p class="text-indigo-600 font-bold">$1,299</p>
                    <div class="flex items-center text-yellow-400 text-[10px] my-1">
                        <i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star-half-stroke"></i>
                        <span class="text-gray-400 ml-1">(12)</span>
                    </div>
                    <button onclick="addToCart()" class="w-full mt-2 bg-indigo-600 text-white py-1.5 rounded-lg text-xs font-medium active:scale-95 transition-transform">
                        Añadir <i class="fa-solid fa-plus ml-1"></i>
                    </button>
                </div>
                <div class="min-w-[160px] md:min-w-[220px] bg-white rounded-xl shadow-sm p-3 border border-gray-100">
                    <div class="h-32 md:h-44 bg-gray-200 rounded-lg mb-3 overflow-hidden">
                        <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&q=80&w=200" alt="Audifonos" class="w-full h-full object-cover">
                    </div>
                    <h3 class="text-sm font-semibold truncate">Auriculares Noise C.</h3>
                    <p class="text-indigo-600 font-bold">$850</p>
                    <div class="flex items-center text-yellow-400 text-[10px] my-1">
                        <i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i>
                        <span class="text-gray-400 ml-1">(48)</span>
                    </div>
                    <button onclick="addToCart()" class="w-full mt-2 bg-indigo-600 text-white py-1.5 rounded-lg text-xs font-medium active:scale-95 transition-transform">
                        Añadir <i class="fa-solid fa-plus ml-1"></i>
                    </button>
                </div>
            </div>
        </section>

        <section class="mt-8 px-4">
            <h2 class="text-xl font-bold mb-4">Tendencias de la semana 🔥</h2>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div class="bg-white rounded-xl shadow-sm p-3 border border-gray-100">
                    <div class="h-40 bg-gray-200 rounded-lg mb-3 overflow-hidden">
                        <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&q=80&w=300" alt="Tennis" class="w-full h-full object-cover">
                    </div>
                    <h3 class="text-sm font-semibold">Zapatillas Sport Red</h3>
                    <p class="text-indigo-600 font-bold">$1,599</p>
                    <div class="flex items-center text-yellow-400 text-[10px] my-1">
                        <i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-regular fa-star"></i>
                        <span class="text-gray-400 ml-1">(120)</span>
                    </div>
                    <button onclick="addToCart()" class="w-full mt-2 bg-gray-900 text-white py-2 rounded-lg text-xs active:bg-indigo-600">Añadir al carrito</button>
                </div>
                <div class="bg-white rounded-xl shadow-sm p-3 border border-gray-100">
                    <div class="h-40 bg-gray-200 rounded-lg mb-3 overflow-hidden">
                        <img src="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?auto=format&fit=crop&q=80&w=300" alt="Instax" class="w-full h-full object-cover">
                    </div>
                    <h3 class="text-sm font-semibold">Cámara Instantánea</h3>
                    <p class="text-indigo-600 font-bold">$2,100</p>
                    <div class="flex items-center text-yellow-400 text-[10px] my-1">
                        <i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i>
                        <span class="text-gray-400 ml-1">(85)</span>
                    </div>
                    <button onclick="addToCart()" class="w-full mt-2 bg-gray-900 text-white py-2 rounded-lg text-xs active:bg-indigo-600">Añadir al carrito</button>
                </div>
            </div>
        </section>

        <section class="mt-10 px-4">
            <h2 class="text-xl font-bold mb-4">Explorar Categorías</h2>
            <div class="grid grid-cols-3 gap-3">
                <div class="bg-indigo-50 p-4 rounded-2xl text-center">
                    <i class="fa-solid fa-laptop text-indigo-600 text-2xl mb-2"></i>
                    <p class="text-xs font-bold">Tech</p>
                </div>
                <div class="bg-pink-50 p-4 rounded-2xl text-center">
                    <i class="fa-solid fa-shirt text-pink-600 text-2xl mb-2"></i>
                    <p class="text-xs font-bold">Moda</p>
                </div>
                <div class="bg-green-50 p-4 rounded-2xl text-center">
                    <i class="fa-solid fa-house text-green-600 text-2xl mb-2"></i>
                    <p class="text-xs font-bold">Hogar</p>
                </div>
            </div>
        </section>
    </main>

    <div id="login-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-[60] flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-2xl p-6 relative">
            <button onclick="toggleModal('login-modal')" class="absolute top-4 right-4 text-gray-400"><i class="fa-solid fa-xmark"></i></button>
            <h2 class="text-2xl font-bold mb-6">Bienvenido a UDG</h2>
            <form onsubmit="event.preventDefault(); alert('Iniciando sesión...');" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Email</label>
                    <input type="email" class="w-full mt-1 border-gray-300 rounded-lg bg-gray-50 border p-2.5 focus:ring-indigo-500 focus:border-indigo-500" placeholder="tu@ejemplo.com">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Contraseña</label>
                    <input type="password" class="w-full mt-1 border-gray-300 rounded-lg bg-gray-50 border p-2.5 focus:ring-indigo-500 focus:border-indigo-500" placeholder="••••••••">
                </div>
                <button type="submit" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold hover:bg-indigo-700"><a href="Pedidos.html">Entrar</a></button>
            </form>
        </div>
    </div>

    <div id="cart-modal" class="hidden fixed inset-y-0 right-0 w-full max-w-xs bg-white shadow-2xl z-[60] p-6 flex flex-col">
        <div class="flex items-center justify-between mb-8">
            <h2 class="text-xl font-bold">Tu Carrito</h2>
            <button onclick="toggleModal('cart-modal')" class="text-gray-400 text-xl"><i class="fa-solid fa-arrow-right"></i></button>
        </div>
        <div id="cart-items" class="flex-1 text-center text-gray-500 flex flex-col justify-center">
            <i class="fa-solid fa-cart-arrow-down text-4xl mb-3"></i>
            <p>Tu carrito está vacío</p>
        </div>
        <div class="border-t pt-4">
            <button class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold disabled:opacity-50" disabled>Pagar Ahora</button>
        </div>
    </div>

    <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around py-3">
        <button class="text-indigo-600 flex flex-col items-center"><i class="fa-solid fa-house"></i><span class="text-[10px]">Inicio</span></button>
        <button class="text-gray-400 flex flex-col items-center"><i class="fa-solid fa-magnifying-glass"></i><span class="text-[10px]">Buscar</span></button>
        <button onclick="toggleModal('cart-modal')" class="text-gray-400 flex flex-col items-center"><i class="fa-solid fa-bag-shopping"></i><span class="text-[10px]">Carrito</span></button>
        <button onclick="toggleModal('login-modal')" class="text-gray-400 flex flex-col items-center"><i class="fa-solid fa-user"></i><span class="text-[10px]">Perfil</span></button>
    </nav>

    <script>
        let count = 0;
        function toggleModal(id) {
            const modal = document.getElementById(id);
            modal.classList.toggle('hidden');
        }

        function addToCart() {
            count++;
            document.getElementById('cart-count').innerText = count;
            document.getElementById('cart-items').innerHTML = `<p class="text-green-600 font-medium">¡Tienes ${count} producto(s) añadidos!</p>`;
        }
    </script>
</body>
</html>
